[package]
name = "imgflare"
version = "1.0.0"
edition = "2024"
description = "A minimal personal image host: Rust/Wasm on Cloudflare Workers with R2, D1 and Turnstile."
license = "MIT"

[lib]
path = "backend/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.11"
hmac = "0.13"

getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
