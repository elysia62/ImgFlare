<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · 个人图床</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="login" class="page-center" data-turnstile-site-key="YOUR_TURNSTILE_SITE_KEY">
    <button
      id="theme-toggle"
      class="btn btn-ghost btn-sm icon-btn theme-top-right"
      type="button"
      title="切换深色 / 浅色"
      aria-label="切换主题"
    >
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
    <main class="card login-card">
      <div class="login-brand">
        <span class="login-logo" aria-hidden="true">IF</span>
        <h1 class="login-title">ImgFlare</h1>
        <p class="login-subtitle">个人图床管理后台</p>
      </div>

      <form id="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">用户名</span>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
            class="input"
            placeholder="请输入用户名"
          />
        </label>

        <label class="field">
          <span class="field-label">密码</span>
          <div class="field-input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="input"
              placeholder="请输入密码"
            />
            <button
              id="toggle-pwd"
              type="button"
              class="field-icon-btn"
              title="显示/隐藏密码"
              aria-label="显示或隐藏密码"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>
        <div id="turnstile" class="turnstile-host" hidden></div>

        <p id="login-error" class="form-error" hidden></p>

        <button id="login-submit" class="btn btn-primary btn-block" type="submit">
          登录
        </button>
      </form>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
