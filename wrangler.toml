name = "imgflare"
main = "dist/worker/shim.mjs"
compatibility_date = "2026-09-27"

compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

[assets]
directory = "./dist/assets"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/index.html", "/login", "/i/*", "/t/*", "/api/*"]

[triggers]
crons = ["0 4 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "imgflare-db"
migrations_dir = "backend/migrations"

[secrets]
required = [
  "ADMIN_USERNAME",
  "ADMIN_PASSWORD",
  "SESSION_SECRET",
  "TURNSTILE_SITE_KEY",
  "TURNSTILE_SECRET",
  "R2_ACCOUNT_ID",
  "R2_ACCESS_KEY_ID",
  "R2_SECRET_ACCESS_KEY",
  "R2_BUCKET",
]
