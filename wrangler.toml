name = "imgflare"
main = "dist/worker/shim.mjs"
compatibility_date = "2026-09-27"

compatibility_flags = ["nodejs_compat"]
# Runtime variables are managed in the dashboard and survive redeployments.
keep_vars = true

[observability]
# Off by default: this is a single-admin personal host and dashboard log
# retention is not wanted. `bun x wrangler tail` still streams logs live, so
# errors remain observable when someone is watching a deploy or an incident.
enabled = false
head_sampling_rate = 0.1
redact_query_string = true

[assets]
directory = "./dist/assets"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/index.html", "/login", "/i/*", "/t/*", "/api/*"]

[triggers]
crons = ["0 4 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "imgflare-db"
migrations_dir = "backend/migrations"

# Account settings are added in Worker Settings > Variables and Secrets after
# the first deployment. Do not require secrets before the Worker is created.
