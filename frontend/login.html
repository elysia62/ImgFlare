<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · 个人图床</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <!--
    Turnstile mounts into #turnstile. The Worker substitutes the site key before
    serving this page; once the challenge is solved the whole widget is hidden
    again so it does not keep occupying space above the button.
  -->
  <body data-page="login" class="page-center" data-turnstile-site-key="YOUR_TURNSTILE_SITE_KEY">
    <main class="card login-card">
      <div class="login-brand">
        <span class="login-logo" aria-hidden="true">IF</span>
        <div>
          <h1 class="login-title">ImgFlare</h1>
          <p class="login-subtitle">个人图床管理后台</p>
        </div>
      </div>

      <form id="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">用户名</span>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            spellcheck="false"
            required
          />
        </label>

        <label class="field">
          <span class="field-label">密码</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <!-- Turnstile mounts here and hides itself once solved. -->
        <div id="turnstile" class="turnstile-host" hidden></div>

        <p id="login-error" class="form-error" hidden></p>

        <button id="login-submit" class="btn btn-primary btn-block" type="submit">
          登录
        </button>
      </form>
    </main>

    <button
      id="theme-toggle"
      class="btn btn-ghost btn-sm icon-btn theme-fab"
      type="button"
      title="切换深色 / 浅色"
      aria-label="切换主题"
    >
      <span class="theme-icon" aria-hidden="true"></span>
    </button>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!--
      Turnstile is the only external script on the page. It is loaded explicitly
      rather than deferred so `auth.ts` can render the widget on demand.
    -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
